<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Report Compilation Hub</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            line-height: 1.6;
            margin: 0;
            padding: 40px 20px;
            background-color: #f4f7f6;
            color: #333;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        h1 {
            color: #1a365d;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 10px;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }
        .card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            transition: transform 0.2s, box-shadow 0.2s;
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
        }
        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 15px rgba(0,0,0,0.1);
            border-left: 4px solid #3182ce;
        }
        .card h2 {
            margin: 0 0 10px 0;
            font-size: 1.25rem;
            color: #2b6cb0;
        }
        .card p {
            margin: 0;
            font-size: 0.9rem;
            color: #4a5568;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>📊 Executive Report Dashboard</h1>
    <p>Select a report below to view its full details.</p>
    
    <div class="grid">
        <!-- Report 1 -->
        <a href="1.html" class="card">
            <h2>📈 Q1 Financial Report</h2>
            <p>Analysis of first-quarter revenue, expenses, and growth metrics.</p>
        </a>

        <!-- Report 2 -->
        <a href="2.html" class="card">
            <h2>👥 Marketing Performance</h2>
            <p>Overview of recent campaign ROI, acquisition costs, and traffic.</p>
        </a>

        <!-- Add more report cards here following the same format -->
    </div>
</div>

</body>
</html>
